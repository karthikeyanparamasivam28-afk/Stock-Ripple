name: Fetch NSE Stocks Above 100
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas
      - run: python fetch.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add nse_data.json
          git commit -m "update" || echo "no change"
          git push
