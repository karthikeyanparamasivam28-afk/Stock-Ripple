name: Fetch NSE Stocks Above 100
on:
  schedule:
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance
      - run: python fetch_nse.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add nse_data.json
          git commit -m "Update NSE Data" || echo "No changes"
          git push
